name: Audio stack checks
on:
  push:
    branches: ["codex/audio-stack-20260920"]
  pull_request:
    paths:
      - "analysis_platform/**"
      - "mixing/**"
      - "services/preprocessing/**"
      - "app/**"
      - "web/**"
      - "tests/**"
      - "requirements-audio-test.txt"
      - ".github/workflows/audio-stack.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-audio-test.txt
            analysis_platform/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r requirements-audio-test.txt
      - name: Analysis, source binding, plans and V3 DSP
        run: >-
          python -m pytest -q
          tests/test_analysis_backfill.py tests/test_analysis_catalog.py
          tests/test_analysis_measurements.py tests/test_analysis_platform.py
          tests/test_analysis_platform_server.py tests/test_analysis_store_io.py
          tests/test_analysis_styles.py tests/test_analysis_platform_library.py
          tests/test_dj_preprocessing.py tests/test_dj_signals.py
          tests/test_demo_render.py tests/test_demo_v2.py tests/test_demo_v3.py
          tests/test_colleague_policy.py tests/test_audio_checkout.py tests/test_realtime_assets.py
          app/tests/test_session.py app/tests/test_transition_planner.py
          app/tests/test_stem_automix_bridge.py
      - name: Deployed preprocessing contract and publication (isolated import root)
        working-directory: services/preprocessing
        run: >-
          python -m pytest -q tests/test_same_style_preprocess_contracts.py
          tests/test_same_style_preprocess_publisher.py tests/test_import_same_style_library.py
      - name: Verify source inventory and frozen V3
        run: python scripts/verify_audio_sources.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run build:live
