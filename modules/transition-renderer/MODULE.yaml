id: transition-renderer
version: 0.1.0
owners:
  - jetson
purpose: Render the deployed default and fast-cut transition WAV/meta pair from two analyzed local audio sources.
inputs:
  - previous and next song objects with source_path, bpm, beat_points, downbeats
  - renderer-neutral transition plan from transition-planner
outputs:
  - transition_render.wav
  - transition_render.json metadata
  - renderer version, timing, phase alignment, continuity and cache status
runtime_dependencies:
  - Python >= 3.10
  - numpy
  - librosa
  - soundfile
  - scipy
data_dependencies:
  - local source audio files
  - plan pair_id and from/to/duration fields
models: []
source_assets:
  - app/modules/dj_control/default_mix/reference_renderer.py
replaces: []
public_functions:
  - ensure_reference_render
  - pair_cache_root
  - pair_dir
health_check: python -m pytest -q modules/transition-renderer/tests
tests:
  - modules/transition-renderer/tests/test_reference_renderer.py
deployment_boundary:
  - This module does not select songs or transition points.
  - This module does not sync assets or call RK.
  - This module writes only its configured pair cache.
renderer_versions:
  - three_band_default_v9_fast_phase_window
  - three_band_default_v7_standalone_curve_no_energy_floor
artifact_sha256: 83c16b982d7a40ce09e50fe859f6f7375ce53066a2c1c8d83b0898835d5c919e
rollback_artifact: git tag module/transition-renderer/v0.1.0
