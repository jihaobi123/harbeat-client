[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbeat-transition-renderer"
version = "0.3.0"
description = "HarBeat transition renderer policy and reference renderer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
