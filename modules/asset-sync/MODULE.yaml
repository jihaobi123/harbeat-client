id: asset-sync
version: 0.2.0
owners:
  - rk3588
purpose: Download, verify, atomically publish, and cache song/render assets on RK.
inputs:
  - song and default_mix pair manifest
  - asset URL, format, size, and optional SHA256
  - priority and wait controls for sync-worker API
outputs:
  - verified local cache files
  - /sync, /status, /cache/check, and /sync/cancel responses
  - per-file transfer and verification timings
runtime_dependencies:
  - Python >= 3.10
  - fastapi
  - uvicorn
  - httpx
  - curl for transport fallback
data_dependencies:
  - RK CYPHER_HOME cache directory
models: []
source_assets:
  - cypher-integration/rk3588-edge/sync-worker/main.py
replaces: []
public_endpoints:
  - POST /sync
  - POST /sync/cancel
  - GET /status
  - GET /cache/check
  - DELETE /cache/song/{song_id}
health_check: python -m pytest -q modules/asset-sync/tests
tests:
  - modules/asset-sync/tests/test_asset_sync.py
  - modules/asset-sync/tests/test_core.py
deployment_boundary:
  - This module does not choose songs or transition points.
  - This module does not render audio.
  - This module does not prepare or schedule RK playback.
clean_architecture:
  - core.py owns asset specifications, cache validation and atomic publication
  - sync_worker.py remains the FastAPI, transport and retry adapter
  - transport selection must become explicit before v1.0
artifact_sha256: 98092b33e6a58021ecc5fd402ebc8d55dd580a7a856c39e425e42f7150dfd9f1
rollback_artifact: git tag module/asset-sync/v0.1.0
