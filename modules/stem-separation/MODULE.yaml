id: stem-separation
version: 0.3.0
owners:
  - jetson
purpose: Offline Demucs separation plus mature-model-first drum and pre-style feature analysis.
inputs:
  - original audio path
  - optional existing stem paths
outputs:
  - vocals.wav
  - drums.wav
  - bass.wav
  - other.wav
  - completeness, reconstruction, and activity metadata
  - kick, snare, hi-hat, tom, and cymbal event candidates
  - drum density, 16-step pattern, fill candidates, and confidence
  - rhythm grammar, bass motion, percussion timbre, and sonic evidence
runtime_dependencies:
  - Python 3.10.12
  - demucs installed in the deployment virtualenv
  - numpy
  - soundfile
  - librosa
  - ffmpeg for optional preview export
  - optional torchcrepe feature worker
  - optional dedicated drum-transcription and audio-tagging workers
data_dependencies:
  - original audio file
  - htdemucs model cache on Jetson
models:
  - htdemucs
  - optional torchcrepe
  - external drum transcriber selected by deployment license
  - external YAMNet or PANNs audio tagger
source_assets:
  - app/modules/library/drum_analysis.py
  - app/modules/library/stem_analysis.py
  - app/modules/library/background_tasks.py
  - app/modules/library/router.py
  - app/modules/playlists/service.py stem runner behavior
replaces: []
public_endpoints:
  - POST /api/library/songs/{library_song_id}/separate-stems
health_check: python -m unittest discover modules/stem-separation/tests
tests:
  - modules/stem-separation/tests/test_analysis.py
  - modules/stem-separation/tests/test_separator.py
contracts:
  - modules/stem-separation/contracts/stem-result.schema.json
  - modules/stem-separation/contracts/drum-analysis.schema.json
  - modules/stem-separation/contracts/pre-style-features.schema.json
artifact_sha256: pending
rollback_artifact: git tag module/stem-separation/v0.1.0
