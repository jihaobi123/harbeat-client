id: stem-separation
version: 0.2.0
owners:
  - jetson
purpose: Offline Demucs separation into four verified stems and stem activity analysis.
inputs:
  - original audio path
  - optional existing stem paths
outputs:
  - vocals.wav
  - drums.wav
  - bass.wav
  - other.wav
  - completeness, reconstruction, and activity metadata
runtime_dependencies:
  - Python 3.10.12
  - demucs installed in the deployment virtualenv
  - numpy
  - soundfile
  - ffmpeg for optional preview export
data_dependencies:
  - original audio file
  - htdemucs model cache on Jetson
models:
  - htdemucs
source_assets:
  - app/modules/library/stem_analysis.py
  - app/modules/library/background_tasks.py
  - app/modules/library/router.py
  - app/modules/playlists/service.py stem runner behavior
replaces: []
public_endpoints:
  - POST /api/library/songs/{library_song_id}/separate-stems
health_check: python -m unittest discover modules/stem-separation/tests
tests:
  - modules/stem-separation/tests/test_analysis.py
  - modules/stem-separation/tests/test_separator.py
  - modules/stem-separation/tests/test_cli.py
public_commands:
  - python -m harbeat_stem_separation AUDIO_PATH OUTPUT_ROOT --model-repo /srv/harbeat-assets/models/demucs
clean_architecture:
  - separator.py owns separation and verified atomic publication
  - runner.py owns the external Demucs process adapter
  - cli.py owns standalone input/output handling
  - production CLI accepts an explicit offline model repository and does not require a user cache
