[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbeat-audio-preprocess"
version = "0.3.0"
description = "HarBeat offline DJ structure analysis contracts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
