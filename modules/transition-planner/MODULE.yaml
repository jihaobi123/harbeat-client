id: transition-planner
version: 0.2.0
owners:
  - jetson
purpose: Plan beat-aware transitions for default, fast-cut, target-energy, and target-style playback.
inputs:
  - two analyzed song objects or mappings
  - live cursor and optional fast-cut execution window
  - optional target energy/style constraints already resolved by selection
outputs:
  - serializable transition plan with exit/entry points
  - beat/phrase alignment metadata and candidate scoring breakdown
  - renderer-neutral duration and pair identity
runtime_dependencies:
  - Python >= 3.10
  - optional librosa only for explicitly enabled legacy audio-window scoring
data_dependencies:
  - persisted beat, downbeat, phrase, energy, vocal, drum, band, and dj_structure_v2 fields
models: []
source_assets:
  - app/modules/dj_control/default_mix/transition_planner.py
  - app/modules/dj_control/band_analysis.py
  - app/modules/dj_control/auto_mixer/feature_analyzer.py
  - app/modules/dj_control/auto_mixer/strategy_selector.py
  - app/modules/dj_control/auto_mixer/mixing_strategies.py
  - app/modules/dj_control/eq_transition_presets.py
  - app/modules/dj_control/mix_profile.py
  - app/modules/dj_control/mixer_rules.py
  - app/modules/dj_control/transition_strategy.py
  - app/modules/dj_control/spotify_mix/section_features.py
  - app/modules/playlists/transition_planner.py
  - app/modules/dj_set/section_energy.py
replaces: []
public_functions:
  - plan_default_transition
  - plan_fast_cut_transition
  - plan_target_energy_transition
  - plan_target_style_transition
  - TransitionPlanningService.plan
health_check: set PYTHONPATH to modules/transition-planner/src, then run python -m unittest discover modules/transition-planner/tests
tests:
  - modules/transition-planner/tests/test_transition_planner.py
  - modules/transition-planner/tests/test_service.py
deployment_boundary:
  - This module does not render WAV/meta.
  - This module does not download or sync assets.
  - This module does not call RK or select the next song.
clean_architecture:
  - service.py owns typed mode dispatch and shared output validation
  - transition_planner.py remains the behavior-compatible planning engine
  - candidate generation, scoring, constraints and alignment split is v0.3 work
artifact_sha256: 8ff95a8c9acf9d1a87348955b6000263866030926261dcd68492298495698a95
rollback_artifact: git tag module/transition-planner/v0.1.0
