id: device-runtime
version: 0.2.0
owners:
  - mobile
  - rk
purpose: Stable device identity, connection health, playback state, and compact operation references.
inputs:
  - RK endpoint supplied by pairing or local discovery
  - health and playback state responses
  - user operation intent
outputs:
  - normalized connection profile
  - typed playback state
  - short-lived operation reference
  - classified connection result
runtime_dependencies:
  - Python >= 3.10
  - Dart adapter to be integrated after contract acceptance
data_dependencies: []
models: []
source_assets:
  - modules/device-runtime
replaces:
  - mobile/lib/src/edge_agent_client.dart connection-state concerns after adapter validation
  - mobile SharedPreferences full-plan persistence after migration validation
public_endpoints:
  - GET /health
  - GET /state
health_check: python -m unittest discover modules/device-runtime/tests
tests:
  - modules/device-runtime/tests/test_connection.py
  - modules/device-runtime/tests/test_endpoint.py
  - modules/device-runtime/tests/test_state.py
  - modules/device-runtime/tests/test_operation.py
  - modules/device-runtime/tests/test_probe.py
  - modules/device-runtime/tests/test_reconnect.py
  - modules/device-runtime/tests/test_session.py
clean_architecture:
  - connection.py owns endpoint lifecycle without network I/O
  - migration.py is the only legacy endpoint import adapter
  - session.py owns device/session operation binding
  - Flutter persistence and HTTP remain adapters
artifact_sha256: f83e900f39f0275c3d9dd3e8df9df506c2dbb5d32064d1ed95429488c7b9c4af
rollback_artifact: git tag module/device-runtime/v0.1.0
