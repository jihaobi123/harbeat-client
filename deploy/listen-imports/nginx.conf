# Include inside the existing HTTPS server. All imports, including task status,
# are owner-authenticated. Public playback remains under /listen/.
location ^~ /api/listen-import/ {
    auth_basic "HarBeat Analysis Admin";
    auth_basic_user_file /etc/nginx/harbeat-analysis.htpasswd;
    client_max_body_size 101m;
    proxy_pass http://127.0.0.1:8771;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_read_timeout 180s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
