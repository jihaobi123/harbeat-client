# Include in the existing trusted HTTPS server. All playback assets live on ECS.
location = /listen {
    return 308 /listen/;
}
location ^~ /listen/media/ {
    alias /srv/harbeat-listen/media/;
    types { audio/flac flac; }
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-HarBeat-Origin cloud-local always;
}
location ^~ /listen/ {
    alias /srv/harbeat-listen/current/;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-HarBeat-Origin cloud-local always;
}
