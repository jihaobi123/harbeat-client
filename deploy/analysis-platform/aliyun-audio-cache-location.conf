# Include BEFORE the general analysis relay regex. Does not cache HTML, JSON or API.
location ~ ^/analysis-lab-static/(v31-candidate-20260923|v3-live-baseline-20260922|v3-protected-20260923)/media/[^/]+\.flac$ {
    limit_except GET {
        auth_basic "HarBeat Analysis Admin";
        auth_basic_user_file /etc/nginx/harbeat-analysis.htpasswd;
    }
    proxy_pass http://100.87.142.21:8765;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    include /etc/nginx/snippets/harbeat-analysis-token.conf;
    proxy_buffering on;
    proxy_cache harbeat_audio;
    proxy_cache_key "$uri|$arg_sha256";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 14d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 180s;
    proxy_cache_lock_age 180s;
    proxy_cache_bypass $harbeat_audio_bypass;
    proxy_no_cache $harbeat_audio_bypass;
    proxy_read_timeout 180s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $harbeat_audio_control;
    add_header X-HarBeat-Audio-Cache $upstream_cache_status always;
}
