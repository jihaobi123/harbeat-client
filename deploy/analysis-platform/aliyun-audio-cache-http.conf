# Install in /etc/nginx/conf.d/ (http context).
# Only fingerprinted public audio gets a long browser cache lifetime.
proxy_cache_path /var/cache/nginx/harbeat-audio levels=1:2 keys_zone=harbeat_audio:20m max_size=5g inactive=14d use_temp_path=off;
map $arg_sha256 $harbeat_audio_bypass {
    default 1;
    "~^[a-f0-9]{64}$" 0;
}
map $harbeat_audio_bypass $harbeat_audio_control {
    0 "public, max-age=31536000, immutable";
    1 "no-store";
}
