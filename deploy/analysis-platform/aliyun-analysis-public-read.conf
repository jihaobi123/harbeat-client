location ~ ^/(analysis-lab(?:/|$)|api/analysis-lab(?:/|$)|analysis-lab-static/) {
    # Colleagues may view and listen without signing in. GET also allows HEAD.
    # All other methods remain administrator-only at the public relay.
    limit_except GET {
        auth_basic "HarBeat Analysis Admin";
        auth_basic_user_file /etc/nginx/harbeat-analysis.htpasswd;
    }
    client_max_body_size 1024m;
    proxy_pass http://100.87.142.21:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    include /etc/nginx/snippets/harbeat-analysis-token.conf;
    proxy_read_timeout 60s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
