location = /listen/smart { return 308 /listen/smart/; }
location ^~ /listen/smart/ {
    alias /srv/harbeat-listen/metric-mix/web/;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
location = /listen/smart-api/jobs {
    limit_req zone=harbeat_metric_jobs burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8791/jobs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /listen/smart-api/ {
    limit_req zone=harbeat_metric_reads burst=16 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /listen/smart-media/ {
    alias /srv/harbeat-listen/metric-mix/media/;
    if ($uri !~ "^/listen/smart-media/[a-f0-9]{64}/(original|bass|filter|yield|vocal|bass_filter)\.wav$") { return 404; }
    types { audio/wav wav; }
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
