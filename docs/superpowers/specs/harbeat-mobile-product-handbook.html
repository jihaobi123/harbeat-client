<head>
  <meta charset="utf-8">

  <meta name="description" content="HarBeat 移动端产品手册、关键路径原型与前端标注">
  <title>HarBeat 移动端产品手册</title>
  <style>:root {
  color-scheme: light;
  font-family: Inter, "PingFang SC", system-ui, sans-serif;
  --paper: #f2efe6;
  --ink: #121311;
  --cobalt: #2457ff;
  --acid: #dcff32;
  --signal: #ff4d36;
  --white: #ffffff;
  --line: #d8d5cb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, input { font: inherit; }
.skip-link { position: absolute; left: -9999px; }
.skip-link:focus { left: 12px; top: 12px; z-index: 20; }
.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  align-items: center;
  gap: 16px;
  min-height: 68px;
  padding: 10px 20px;
  background: rgba(242,239,230,.96);
  border-bottom: 1px solid var(--line);
}
.brand { color: var(--ink); font-weight: 950; text-decoration: none; letter-spacing: -.04em; }
.mode-tabs { display: flex; justify-content: center; gap: 6px; }
.mode-tabs button, .scenario-nav button, .scenario-nav a, .reset-button, .spec-link {
  border: 0;
  border-radius: 10px;
  padding: 9px 12px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
}
.mode-tabs [aria-selected="true"] { background: var(--ink); color: var(--white); }
.mock-badge { padding: 6px 8px; background: var(--acid); border: 1px solid var(--ink); border-radius: 3px; font-size: 12px; font-weight: 850; }
.app-body { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: calc(100vh - 68px); }
.scenario-nav { display: flex; flex-direction: column; gap: 6px; padding: 22px 14px; border-right: 1px solid var(--line); }
.scenario-nav [aria-current="page"] { background: var(--cobalt); color: var(--white); }
#main-panel { min-width: 0; padding: clamp(18px, 4vw, 54px); }
.handbook { max-width: 1080px; margin: 0 auto; }
.handbook-hero { position: relative; min-height: 430px; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 6vw, 80px); border-radius: 24px; background: linear-gradient(135deg, #2457ff, #784fca 55%, #ef8c70); color: var(--white); overflow: hidden; }
.handbook-hero h1 { max-width: 820px; margin: 12px 0 20px; font-size: clamp(42px, 7vw, 88px); line-height: .94; letter-spacing: -.07em; }
.handbook-hero > p { max-width: 640px; }
.zine-sticker { position: absolute; right: 26px; top: 24px; padding: 8px 10px; background: var(--acid); border: 2px solid var(--ink); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); font-weight: 900; transform: rotate(2deg); }
.eyebrow { font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.hero-actions, .related-views { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.primary-button, .secondary-button, .related-views button { border: 1px solid var(--ink); border-radius: 10px; padding: 11px 15px; font-weight: 800; cursor: pointer; }
.primary-button { background: var(--acid); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.secondary-button { background: var(--white); color: var(--ink); }
.handbook-section { margin-top: 24px; padding: clamp(24px, 5vw, 52px); background: var(--white); border: 1px solid var(--line); border-radius: 20px; }
.handbook-section h2 { max-width: 760px; margin: 10px 0; font-size: clamp(28px, 4vw, 52px); line-height: 1.02; letter-spacing: -.04em; }
.section-summary { max-width: 760px; font-size: 20px; color: #4e4e49; }
.section-body { max-width: 820px; line-height: 1.75; color: #4e4e49; }
.responsibility-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.responsibility-grid article { display: grid; gap: 6px; padding: 16px; background: var(--paper); border-radius: 12px; }
.related-views button { background: var(--paper); }
@media (max-width: 760px) {
  .app-header { grid-template-columns: auto 1fr auto; }
  .mock-badge, .spec-link { display: none; }
  .app-body { grid-template-columns: 1fr; }
  .scenario-nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>

  <script>const scenarioSteps = Object.freeze({
  discover: ['V01', 'V02', 'V04', 'V05'],
  import: ['V02', 'V03', 'V04', 'V05'],
  device: ['V06', 'V07', 'V08', 'V09', 'V08'],
});

const fallbackPads = () => Array.from({ length: 8 }, (_, index) => ({
  id: `pad-${index + 1}`,
  label: `Pad ${index + 1}`,
  sound: index < 3 ? ['Air Horn', 'Crowd Up', 'Hit'][index] : null,
}));

const content = () => {
  if (globalThis.HBContent) return globalThis.HBContent;
  if (typeof require !== 'undefined') return require('./content.js');
  throw new Error('HBContent is required');
};

const initialState = () => ({
  mode: 'handbook',
  scenario: 'discover',
  viewId: 'V01',
  stepIndex: 0,
  selectedTrackId: 'trk-electric',
  savedTrackIds: [],
  playlistTrackIds: { 'pl-practice': [], 'pl-battle': ['trk-lock'], 'pl-late': ['trk-midnight', 'trk-sidewalk'] },
  selectedPlaylistId: 'pl-practice',
  previewPlaying: false,
  importMode: 'search',
  deviceConnectionState: 'connected',
  pairingState: 'idle',
  pairingHost: '',
  appPresetVersion: 3,
  devicePresetVersion: 3,
  padSlots: (globalThis.HBContent?.pads || fallbackPads()).map((pad) => ({ ...pad })),
  syncState: 'synced',
  overlay: null,
  toast: null,
});

const selectedTrack = (state) => content().songs.find((track) => track.id === state.selectedTrackId);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

const reduce = (state, action) => {
  switch (action.type) {
    case 'SET_MODE':
      return { ...state, mode: action.mode, overlay: null };
    case 'SET_SCENARIO': {
      const steps = scenarioSteps[action.scenario];
      return { ...state, scenario: action.scenario, stepIndex: 0, viewId: steps[0], overlay: null, toast: null };
    }
    case 'GO_TO_VIEW': {
      const index = scenarioSteps[state.scenario].indexOf(action.viewId);
      return { ...state, viewId: action.viewId, stepIndex: index >= 0 ? index : state.stepIndex, overlay: null };
    }
    case 'NEXT_STEP': {
      const steps = scenarioSteps[state.scenario];
      const stepIndex = clamp(state.stepIndex + 1, 0, steps.length - 1);
      return { ...state, stepIndex, viewId: steps[stepIndex], overlay: null };
    }
    case 'PREVIOUS_STEP': {
      const steps = scenarioSteps[state.scenario];
      const stepIndex = clamp(state.stepIndex - 1, 0, steps.length - 1);
      return { ...state, stepIndex, viewId: steps[stepIndex], overlay: null };
    }
    case 'SELECT_TRACK':
      return { ...state, selectedTrackId: action.trackId, previewPlaying: false, viewId: 'V04' };
    case 'SET_IMPORT_MODE':
      return { ...state, importMode: action.mode };
    case 'TOGGLE_PREVIEW':
      return { ...state, previewPlaying: !state.previewPlaying };
    case 'OPEN_SAVE':
      return { ...state, overlay: 'save-track' };
    case 'SAVE_TRACK': {
      const savedTrackIds = [...new Set([...state.savedTrackIds, action.trackId])];
      const current = state.playlistTrackIds[action.playlistId] || [];
      const playlistTrackIds = {
        ...state.playlistTrackIds,
        [action.playlistId]: [...new Set([...current, action.trackId])],
      };
      const playlistName = content().playlists.find((item) => item.id === action.playlistId)?.name || '曲库';
      return {
        ...state,
        savedTrackIds,
        playlistTrackIds,
        selectedPlaylistId: action.playlistId,
        overlay: null,
        toast: `已保存到「${playlistName}」`,
      };
    }
    case 'EDIT_PAD':
      return {
        ...state,
        padSlots: state.padSlots.map((pad) => pad.id === action.padId ? { ...pad, sound: action.sound } : pad),
        appPresetVersion: state.appPresetVersion + 1,
        syncState: 'dirty',
      };
    case 'REQUEST_SYNC':
      return state.deviceConnectionState === 'connected'
        ? { ...state, overlay: 'sync-confirm' }
        : { ...state, overlay: null, toast: '设备未连接，无法同步' };
    case 'CONFIRM_SYNC':
      return state.overlay === 'sync-confirm' && state.deviceConnectionState === 'connected'
        ? {
            ...state,
            overlay: null,
            syncState: 'synced',
            devicePresetVersion: state.appPresetVersion,
            toast: 'Pad 预设已同步',
          }
        : state;
    case 'DISCONNECT_DEVICE':
      return {
        ...state,
        deviceConnectionState: 'disconnected',
        syncState: state.syncState === 'dirty' ? 'dirty' : 'offline',
        toast: '设备连接已断开',
      };
    case 'RECONNECT_DEVICE':
      return {
        ...state,
        deviceConnectionState: 'connected',
        syncState: state.appPresetVersion === state.devicePresetVersion ? 'synced' : 'dirty',
        toast: '设备已重新连接',
      };
    case 'CLOSE_OVERLAY':
      return { ...state, overlay: null };
    case 'CLEAR_TOAST':
      return { ...state, toast: null };
    case 'RESET':
      return initialState();
    default:
      return state;
  }
};

const HBModel = Object.freeze({ initialState, reduce, selectedTrack, scenarioSteps });
globalThis.HBModel = HBModel;
if (typeof module !== 'undefined') module.exports = HBModel;
</script>
  <script>globalThis.HBViews = globalThis.HBViews || {};

globalThis.HBViews.handbook = (state, content) => `
  <main class="handbook" tabindex="-1">
    <section class="handbook-hero">
      <span class="zine-sticker">PRODUCT / ${content.meta.version}</span>
      <p class="eyebrow">MOBILE APP · PRODUCT HANDBOOK</p>
      <h1>让舞者找歌，<br>让设备稳定完成现场播放。</h1>
      <p>HarBeat 手机 App 产品手册、关键路径原型与前端交付说明。</p>
      <div class="hero-actions">
        <button class="primary-button" data-mode="prototype">开始体验原型</button>
        <button class="secondary-button" data-mode="annotations">查看前端标注</button>
      </div>
    </section>
    ${content.handbookSections.map((section, index) => `
      <article id="${section.id}" class="handbook-section">
        <p class="eyebrow">${String(index + 1).padStart(2, '0')} / ${section.eyebrow}</p>
        <h2>${section.title}</h2>
        <p class="section-summary">${section.summary}</p>
        <div class="section-body">${section.body}</div>
        <div class="related-views">
          ${section.relatedViewIds.map((id) => `<button data-view="${id}" data-mode="prototype">查看 ${id}</button>`).join('')}
        </div>
      </article>`).join('')}
  </main>`;

globalThis.HBViews = globalThis.HBViews || {};
globalThis.HBViews.prototype = () => '<main><h1>交互原型</h1></main>';

globalThis.HBViews = globalThis.HBViews || {};
globalThis.HBViews.annotations = () => '<main><h1>前端标注</h1></main>';
</script>
  <script>(() => {
  const root = document.querySelector('#app');
  let state = HBModel.initialState();

  const dispatch = (action) => {
    state = HBModel.reduce(state, action);
    render();
  };

  const render = () => {
    const sidebars = {
      handbook: `<nav class="scenario-nav" aria-label="手册章节">${HBContent.handbookSections.map((section) => `<a href="#${section.id || 'positioning'}">${section.title || section}</a>`).join('')}</nav>`,
      prototype: `<nav class="scenario-nav" aria-label="场景导航">${Object.entries(HBContent.scenarios).map(([id, item]) => `<button data-scenario="${id}" aria-current="${state.scenario === id ? 'page' : 'false'}">${item.label}</button>`).join('')}</nav>`,
      annotations: `<nav class="scenario-nav" aria-label="页面标注导航">${Object.entries(HBContent.views).map(([id, item]) => `<button data-view="${id}" aria-current="${state.viewId === id ? 'page' : 'false'}">${id} · ${item.name}</button>`).join('')}</nav>`,
    };

    root.innerHTML = `
      <header class="app-header">
        <a class="brand" href="#top" aria-label="HarBeat 首页">HARBEAT®</a>
        <div class="mode-tabs" role="tablist" aria-label="显示模式">
          <button role="tab" data-mode="handbook" aria-selected="${state.mode === 'handbook'}">产品手册</button>
          <button role="tab" data-mode="prototype" aria-selected="${state.mode === 'prototype'}">交互原型</button>
          <button role="tab" data-mode="annotations" aria-selected="${state.mode === 'annotations'}">前端标注</button>
        </div>
        <span class="mock-badge">${HBContent.meta.dataLabel}</span>
        <a class="spec-link" href="${HBContent.meta.specFile}">完整规格</a>
        <button class="reset-button" data-action="reset">重置演示</button>
      </header>
      <div class="app-body" id="top">
        ${sidebars[state.mode]}
        <section id="main-panel">${HBViews[state.mode](state, HBContent)}</section>
      </div>`;
  };

  root.addEventListener('click', (event) => {
    const mode = event.target.closest('[data-mode]');
    const scenario = event.target.closest('[data-scenario]');
    const view = event.target.closest('[data-view]');
    const action = event.target.closest('[data-action]');
    if (scenario) dispatch({ type: 'SET_SCENARIO', scenario: scenario.dataset.scenario });
    if (view) dispatch({ type: 'GO_TO_VIEW', viewId: view.dataset.view });
    if (mode) dispatch({ type: 'SET_MODE', mode: mode.dataset.mode });
    if (action?.dataset.action === 'reset') dispatch({ type: 'RESET' });
  });

  globalThis.HBApp = { dispatch, getState: () => structuredClone(state) };
  render();
})();
</script>
</body>
